</div></header><div class="page-container"><div class="page-content"><div class="map-grid" id="levelGridContainer"></div></div></div></div><div id="levelUpModal" class="custom-modal-overlay level-up-overlay"><div class="custom-modal-box level-up-box"><div class="burst-bg"></div><div class="level-badge-container"><div class="level-ring-back"><img id="lvlUpAvatarImg" class="level-up-avatar-img" src="" alt="Avatar"></div><div class="level-num-badge" id="lvlUpNumberBadge">?</div></div><h2 class="level-up-title">ارتقای سطح!</h2><p class="level-up-rank" id="lvlUpRankTitle">...</p><div class="level-rewards-paper"><div class="tape-piece"></div><span class="reward-label">پاداش تلاش شما:</span><div class="reward-items"><div class="reward-pill coin"><span id="lvlRewardCoin">100</span> <img src="assets/icons/coin.webp" style="width: 24px; height: 24px; margin-right: 5px;"></div></div></div><button class="modal-btn modal-btn-confirm" onclick="SFX.play('ui_tap'); MapLevelManager.closeModal(); setTimeout(() => { if(window.openRatingModal) window.openRatingModal(); }, 300);" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 auto; max-width: 200px;">عالیه! <img src="assets/icons/check-green.webp" style="width: 20px; height: 20px;"></button></div><canvas id="confettiCanvas"></canvas></div><div id="installModal" class="custom-modal-overlay"><div class="custom-modal-box install-modal-box" style="text-align: center; border: 3px solid var(--primary); padding: 25px 20px; max-width: 340px;"><div style="position: relative; margin-bottom: 15px; display: flex; justify-content: center;"><img src="assets/icons/android2.webp" style="width: 85px; height: 85px; position: relative; z-index: 1; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.25)); transform: rotate(-6deg);"></div><h3 class="modal-title" style="color: var(--primary); font-size: 1.55rem; margin-bottom: 12px; font-weight: 900;">مراحل حیوونی‌تر! 🚀</h3><p class="modal-message" style="color: var(--text-primary); margin-bottom: 20px; font-size: 1.15rem; line-height: 1.8; font-weight: 900; text-align: center;">برای دسترسی به <span style="color: #ffc107; text-shadow: 0 1px 2px rgba(0,0,0,0.6);">مراحل جدید</span> و رقابت،<br>اپلیکیشن <strong>«حیوونی»</strong> رو رو گوشیت نصب کن!</p><div style="background: color-mix(in srgb, var(--bg-surface) 70%, transparent); border: 2px dashed var(--border-color); border-radius: 12px; padding: 12px 10px; margin-bottom: 22px; box-shadow: 2px 2px 0 rgba(0,0,0,0.05); transform: rotate(-0.5deg);"><span style="display: block; font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 5px;">🔍 جستجو و نصب در:</span> <strong style="font-size: 1.35rem; color: var(--primary); letter-spacing: 0.5px; display: block;"><span style="color: #51cbff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); margin-left: 4px;">مـایکـت</span> و <span style="color: #00ff04; text-shadow: 0 1px 2px rgba(0,0,0,0.6);margin-right:5px;">بـازار</span></strong></div><button class="modal-btn modal-btn-cancel" onclick="closeInstallModal()" style="margin-top: 0; width: 100%; font-size: 1.1rem; padding: 14px; box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.15);">متوجه شدم</button></div></div><script src="map.js"></script><script src="security-source.js"></script><script src="rating.js"></script></body></html>
